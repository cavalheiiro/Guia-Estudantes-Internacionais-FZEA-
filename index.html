    let currentLang = 'pt';

    document.addEventListener("DOMContentLoaded", function() {
      renderContent(currentLang);
    });

    function setLanguage(lang, btn) {
      currentLang = lang;
      document.querySelectorAll('.btn-lang').forEach(b => {
        b.classList.remove('btn-fzea', 'active');
        b.classList.add('btn-outline-primary');
      });
      btn.classList.remove('btn-outline-primary');
      btn.classList.add('btn-fzea', 'active');

      renderContent(lang);
    }

    function abrirAba(idSection) {
    const secao = document.getElementById(idSection);
    if (!secao) return;

    // Encontra o elemento collapse do Bootstrap dentro da seção
    const collapseElem = secao.querySelector('.accordion-collapse') || secao;

    // Se estiver usando Bootstrap 5, abre a aba sanfonada
    if (collapseElem && window.bootstrap) {
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElem);
        bsCollapse.show();
    }

    // Rola a tela suavemente até a aba aberta
    setTimeout(() => {
        secao.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 150);
    }

    function renderContent(lang) {
      const data = contentData[lang];
      document.getElementById('headerSub').innerText = data.headerSub;
      document.getElementById('cardTitle').innerHTML = `<i class="bi bi-journal-bookmark-fill me-2"></i>${data.cardTitle}`;
      document.getElementById('labelSelect').innerHTML = `<i class="bi bi-funnel me-1"></i>${data.labelSelect}`;

      // Renderiza Select
      const select = document.getElementById('secaoSelect');
      select.innerHTML = `<option value="">${data.selectPlaceholder}</option>`;

      // Renderiza Accordion
      const accordion = document.getElementById('accordionGuia');
      accordion.innerHTML = '';

      data.sections.forEach((sec, idx) => {
        // Popula Select
        select.innerHTML += `<option value="${sec.id}">${sec.title}</option>`;

        // Popula Accordion
        const isFirst = idx === 0 ? 'show' : '';
        const isCollapsed = idx === 0 ? '' : 'collapsed';

        accordion.innerHTML += `
          <div class="accordion-item" id="${sec.id}">
            <h2 class="accordion-header">
              <button class="accordion-button ${isCollapsed}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse_${sec.id}">
                <i class="bi ${sec.icon} me-2 text-primary"></i> ${sec.title}
              </button>
            </h2>
            <div id="collapse_${sec.id}" class="accordion-collapse collapse ${isFirst}" data-bs-parent="#accordionGuia">
              <div class="accordion-body">
                ${sec.content}
              </div>
            </div>
          </div>
        `;
      });
    }

    function rolarParaSecao() {
      const secId = document.getElementById('secaoSelect').value;
      if (!secId) return;

      const targetEl = document.getElementById(secId);
      if (targetEl) {
        const collapseEl = document.getElementById(`collapse_${secId}`);
        if (collapseEl) {
          const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });
          bsCollapse.show();
        }
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
